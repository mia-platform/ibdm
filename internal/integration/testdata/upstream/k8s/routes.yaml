# Fake Kubernetes API server of the fictional cluster of acme-widgets, reached through HTTP_PROXY
# as http://k8s-api.example.com. The JSON bodies are generated by generate.py.
# - Nodes worker-a (tainted, 4 CPU) and worker-b (2.5 CPU).
# - Namespaces storefront and platform, over two pages (continue token).
# - storefront: Deployment catalog-api (installed by Helm, release catalog-api revision 3),
#   StatefulSet orders-db, Services catalog-api, orders-db and legacy-billing (ExternalName),
#   a NetworkPolicy, an IngressRoute (to catalog-api and to api@internal), a Certificate.
# - platform: DaemonSet log-agent.
# - Pods: one of the Deployment (through its ReplicaSet), one of the StatefulSet, one of a Job,
#   and a Succeeded Job pod that is not synchronised.
routes:
  # Discovery, for the CRD-backed kinds.
  - method: GET
    path: /api
    body: api-versions.json
  - method: GET
    path: /apis
    body: api-groups.json
  - method: GET
    path: /apis/traefik.io/v1alpha1
    body: traefik-resources.json
  - method: GET
    path: /apis/cert-manager.io/v1
    body: cert-manager-resources.json
  # Core and apps lists.
  - method: GET
    path: /api/v1/nodes
    body: nodes.json
  - method: GET
    path: /api/v1/namespaces
    query: {continue: namespaces-page-2}
    body: namespaces-page-2.json
  - method: GET
    path: /api/v1/namespaces
    body: namespaces-page-1.json
  - method: GET
    path: /apis/apps/v1/deployments
    body: deployments.json
  - method: GET
    path: /apis/apps/v1/statefulsets
    body: statefulsets.json
  - method: GET
    path: /apis/apps/v1/daemonsets
    body: daemonsets.json
  - method: GET
    path: /api/v1/services
    body: services.json
  - method: GET
    path: /apis/networking.k8s.io/v1/networkpolicies
    body: networkpolicies.json
  - method: GET
    path: /api/v1/secrets
    query: {labelSelector: "owner=helm,status=deployed"}
    body: helm-secrets.json
  - method: GET
    path: /api/v1/pods
    body: pods.json
  # Custom resources.
  - method: GET
    path: /apis/traefik.io/v1alpha1/ingressroutes
    body: ingressroutes.json
  - method: GET
    path: /apis/cert-manager.io/v1/certificates
    body: certificates.json
