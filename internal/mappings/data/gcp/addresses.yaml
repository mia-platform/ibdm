apiVersion: gcp.mia-platform.eu/v1
itemFamily: addresses
type: compute.googleapis.com/Address
syncable: true
mappings:
  identifier: |-
    {{ $components := trimPrefix "//compute.googleapis.com/" .name | split "/" -}}
    {{- if eq (index $components 2) "regions" -}}
      {{- printf "%s-%s-%s" (index $components 1) (index $components 3) (last $components) -}}
    {{- else -}}
      {{- printf "%s-%s" (index $components 1) (last $components) -}}
    {{- end }}
  metadata:
    title: "{{ .resource.data.name }}"
  spec:
    name: "{{ .resource.data.name }}"
    description: "{{ get \"description\" .resource.data \"\" | quote }}"
    address: "{{ .resource.data.address | quote }}"
    addressType: "{{ get \"addressType\" .resource.data \"EXTERNAL\" | lower }}"
    ipVersion: "{{ get \"ipVersion\" .resource.data \"IPV4\" | lower }}"
    purpose: "{{ get \"purpose\" .resource.data \"\" | lower | quote }}"
    status: "{{ .resource.data.status | lower }}"
    networkTier: "{{ get \"networkTier\" .resource.data \"\" | lower | quote }}"
    network: "{{ get \"network\" .resource.data \"\" | trimPrefix \"https://www.googleapis.com/compute/v1/\" | quote }}"
    subnetwork: "{{ get \"subnetwork\" .resource.data \"\" | trimPrefix \"https://www.googleapis.com/compute/v1/\" | quote }}"
    users: |-
      {{ $list := list -}}
      {{- range get "users" .resource.data (list) -}}
        {{- $list = append $list (trimPrefix "https://www.googleapis.com/compute/v1/" .) -}}
      {{- end -}}
      {{- $list | toJSON }}
    creationTimestamp: "{{ .resource.data.creationTimestamp | quote }}"
    location: "{{ .resource.location }}"
    labels: "{{ get \"labels\" .resource.data (object) | toJSON }}"
  extra:
    - apiVersion: mia-platform.eu/v1
      itemFamily: relationships
      deletePolicy: "cascade"
      createIf: |-
        {{ $components := trimPrefix "//compute.googleapis.com/" .name | split "/" -}}
        {{- $self := "" -}}
        {{- if eq (index $components 2) "regions" -}}
          {{- $self = printf "%s-%s-%s" (index $components 1) (index $components 3) (last $components) -}}
        {{- else -}}
          {{- $self = printf "%s-%s" (index $components 1) (last $components) -}}
        {{- end -}}
        {{- $routerID := "" -}}
        {{- range get "users" .resource.data (list) -}}
          {{- $parts := split "/" (trimPrefix "https://www.googleapis.com/compute/v1/" .) -}}
          {{- if eq (len $parts) 6 -}}
            {{- if eq (index $parts 4) "routers" -}}
              {{- if eq $routerID "" -}}
                {{- $routerID = printf "%s-%s-%s" (index $parts 1) (index $parts 3) (index $parts 5) -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}
        {{- end -}}
        {{- if ne $routerID "" -}}
          true
        {{- else -}}
          false
        {{- end }}
      identifier: |-
        {{ $components := trimPrefix "//compute.googleapis.com/" .name | split "/" -}}
        {{- $self := "" -}}
        {{- if eq (index $components 2) "regions" -}}
          {{- $self = printf "%s-%s-%s" (index $components 1) (index $components 3) (last $components) -}}
        {{- else -}}
          {{- $self = printf "%s-%s" (index $components 1) (last $components) -}}
        {{- end -}}
        {{- $routerID := "" -}}
        {{- range get "users" .resource.data (list) -}}
          {{- $parts := split "/" (trimPrefix "https://www.googleapis.com/compute/v1/" .) -}}
          {{- if eq (len $parts) 6 -}}
            {{- if eq (index $parts 4) "routers" -}}
              {{- if eq $routerID "" -}}
                {{- $routerID = printf "%s-%s-%s" (index $parts 1) (index $parts 3) (index $parts 5) -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}
        {{- end -}}
        {{- $src := printf "urn:mia-platform-catalog:gcp.mia-platform.eu:v1:Router:%s" $routerID -}}
        {{- $type := "urn:mia-platform-catalog:mia-platform.eu:v1:RelationshipType:dependency.mia-platform.eu" -}}
        {{- $tgt := printf "urn:mia-platform-catalog:gcp.mia-platform.eu:v1:Address:%s" $self -}}
        {{- printf "%s-%s-%s" $src $type $tgt | sha256sum }}
      sourceRef: |-
        {{ $components := trimPrefix "//compute.googleapis.com/" .name | split "/" -}}
        {{- $self := "" -}}
        {{- if eq (index $components 2) "regions" -}}
