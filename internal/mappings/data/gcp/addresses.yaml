        {{- $routerID := "" -}}
        {{- range get "users" .resource.data (list) -}}
          {{- $parts := split "/" (trimPrefix "https://www.googleapis.com/compute/v1/" .) -}}
          {{- if eq (len $parts) 6 -}}
            {{- if eq (index $parts 4) "routers" -}}
