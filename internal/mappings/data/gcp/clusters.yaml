apiVersion: gcp.mia-platform.eu/v1
itemFamily: clusters
type: container.googleapis.com/Cluster
syncable: true
mappings:
  identifier: |-
    {{ $components := trimPrefix "//container.googleapis.com/" .name | split "/" -}}
    {{- printf "%s-%s-%s" (index $components 1) (index $components 3) (index $components 5) }}
  metadata:
    title: "{{ .resource.data.name }}"
  spec:
    name: "{{ .resource.data.name }}"
    description: "{{ get \"description\" .resource.data \"\" | quote }}"
    autopilot: "{{ get \"enabled\" .resource.data.autopilot false }}"
    apiServerVersion: "{{ .resource.data.currentMasterVersion }}"
    network: "{{ .resource.data.networkConfig.network }}"
    subnetwork: "{{ .resource.data.networkConfig.subnetwork }}"
    podsIpv4Cidr: "{{ .resource.data.clusterIpv4Cidr }}"
    servicesIpv4Cidr: "{{ .resource.data.servicesIpv4Cidr }}"
    clusterEndpoints: "{{ .resource.data.controlPlaneEndpointsConfig | toJSON }}"
    status: "{{ .resource.data.status | lower }}"
    location: "{{ .resource.location }}"
    labels: "{{ get \"resourceLabels\" .resource.data (object) | toJSON }}"
  extra:
    - apiVersion: mia-platform.eu/v1
      itemFamily: relationships
      deletePolicy: "cascade"
      createIf: |-
        {{ $components := trimPrefix "//container.googleapis.com/" .name | split "/" -}}
        {{- $cluster := printf "%s-%s-%s" (index $components 1) (index $components 3) (index $components 5) -}}
        {{- $config := get "networkConfig" .resource.data (object) -}}
        {{- $network := get "network" $config "" | trimPrefix "https://www.googleapis.com/compute/v1/" | split "/" -}}
        {{- $networkID := "" -}}
        {{- if eq (len $network) 5 -}}
          {{- $networkID = printf "%s-%s" (index $network 1) (index $network 4) -}}
        {{- end -}}
        {{- if ne $networkID "" -}}
          true
        {{- else -}}
          false
        {{- end }}
      identifier: |-
        {{ $components := trimPrefix "//container.googleapis.com/" .name | split "/" -}}
        {{- $cluster := printf "%s-%s-%s" (index $components 1) (index $components 3) (index $components 5) -}}
        {{- $config := get "networkConfig" .resource.data (object) -}}
        {{- $network := get "network" $config "" | trimPrefix "https://www.googleapis.com/compute/v1/" | split "/" -}}
        {{- $networkID := "" -}}
        {{- if eq (len $network) 5 -}}
          {{- $networkID = printf "%s-%s" (index $network 1) (index $network 4) -}}
        {{- end -}}
        {{- $src := printf "urn:mia-platform-catalog:gcp.mia-platform.eu:v1:Cluster:%s" $cluster -}}
        {{- $type := "urn:mia-platform-catalog:mia-platform.eu:v1:RelationshipType:dependency.mia-platform.eu" -}}
        {{- $tgt := printf "urn:mia-platform-catalog:gcp.mia-platform.eu:v1:Network:%s" $networkID -}}
        {{- printf "%s-%s-%s" $src $type $tgt | sha256sum }}
      sourceRef: |-
        {{ $components := trimPrefix "//container.googleapis.com/" .name | split "/" -}}
        {{- $cluster := printf "%s-%s-%s" (index $components 1) (index $components 3) (index $components 5) -}}
        {{- $config := get "networkConfig" .resource.data (object) -}}
        {{- $network := get "network" $config "" | trimPrefix "https://www.googleapis.com/compute/v1/" | split "/" -}}
        {{- $networkID := "" -}}
        {{- if eq (len $network) 5 -}}
          {{- $networkID = printf "%s-%s" (index $network 1) (index $network 4) -}}
        {{- end -}}
        {{- printf "urn:mia-platform-catalog:gcp.mia-platform.eu:v1:Cluster:%s" $cluster }}
      targetRef: |-
        {{ $components := trimPrefix "//container.googleapis.com/" .name | split "/" -}}
        {{- $cluster := printf "%s-%s-%s" (index $components 1) (index $components 3) (index $components 5) -}}
        {{- $config := get "networkConfig" .resource.data (object) -}}
        {{- $network := get "network" $config "" | trimPrefix "https://www.googleapis.com/compute/v1/" | split "/" -}}
        {{- $networkID := "" -}}
        {{- if eq (len $network) 5 -}}
          {{- $networkID = printf "%s-%s" (index $network 1) (index $network 4) -}}
        {{- end -}}
        {{- printf "urn:mia-platform-catalog:gcp.mia-platform.eu:v1:Network:%s" $networkID }}
      typeRef: "urn:mia-platform-catalog:mia-platform.eu:v1:RelationshipType:dependency.mia-platform.eu"
