apiVersion: azure.mia-platform.eu/v1
itemFamily: keyvaults
type: Microsoft.KeyVault/vaults
extra:
  apiVersion: "2026-02-01"
syncable: true
mappings:
  identifier: "{{ .id | sha256sum }}"
  metadata:
    title: "{{ .name }}"
  spec:
    name: "{{ .name }}"
    id: "{{ .id }}"
    enableRbacAuthorization: "{{ .properties.enableRbacAuthorization }}"
    enableSoftDelete: "{{ .properties.enableSoftDelete }}"
    enabledForDeployment: "{{ .properties.enabledForDeployment }}"
    enabledForDiskEncryption: |-
      {{ $enabledForDiskEncryption := (get "enabledForDiskEncryption" .properties "") -}}
      {{- if $enabledForDiskEncryption -}}
        {{- .properties.enabledForDiskEncryption -}}
      {{- else -}}
        {{- false -}}
      {{- end }}
    provisioningState: "{{ .properties.provisioningState }}"
    publicNetworkAccess: "{{ .properties.publicNetworkAccess }}"
    tenantId: "{{ .properties.tenantId }}"
    vaultUri: "{{ .properties.vaultUri }}"
    tags: |-
      {{ $tags := (get "tags" . "") -}}
      {{- if $tags -}}
        {{- $tags | toJSON  -}}
      {{- else -}}
        {{- object | toJSON -}}
      {{- end }}
