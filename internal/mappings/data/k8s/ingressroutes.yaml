apiVersion: k8s.mia-platform.eu/v1
itemFamily: traefikingressroutes
type: ingressroute
syncable: true
mappings:
  identifier: |-
    {{ printf "k8s-%s-ingressroute-%s-%s" (replace "https://" "" .apiServer) .namespace .name | sha256sum }}
  metadata:
    title: "{{ .name }}"
  spec:
    name: "{{ .name | toJSON }}"
    namespace: "{{ .namespace | toJSON }}"
    labels: "{{ .labels | toJSON }}"
    entryPoints: "{{ .entryPoints | toJSON }}"
    routes: "{{ .routes | toJSON }}"
    tls: "{{ .tls | toJSON }}"
  extra:
    - apiVersion: mia-platform.eu/v1
      itemFamily: relationships
      deletePolicy: "cascade"
      identifier: |-
        {{ $src := printf "urn:mia-platform-catalog:k8s.mia-platform.eu:v1:TraefikIngressRoute:%s" (printf "k8s-%s-ingressroute-%s-%s" (replace "https://" "" .apiServer) .namespace .name | sha256sum) -}}
        {{- $type := "urn:mia-platform-catalog:mia-platform.eu:v1:RelationshipType:part-of.mia-platform.eu" -}}
        {{- $tgt := printf "urn:mia-platform-catalog:k8s.mia-platform.eu:v1:K8sNamespace:%s" (printf "%s-%s" (replace "https://" "" .apiServer) .namespace | sha256sum) -}}
        {{- printf "%s-%s-%s" $src $type $tgt | sha256sum }}
      sourceRef: |-
        urn:mia-platform-catalog:k8s.mia-platform.eu:v1:TraefikIngressRoute:{{ printf "k8s-%s-ingressroute-%s-%s" (replace "https://" "" .apiServer) .namespace .name | sha256sum }}
      targetRef: |-
        urn:mia-platform-catalog:k8s.mia-platform.eu:v1:K8sNamespace:{{ printf "%s-%s" (replace "https://" "" .apiServer) .namespace | sha256sum }}
      typeRef: "urn:mia-platform-catalog:mia-platform.eu:v1:RelationshipType:part-of.mia-platform.eu"
