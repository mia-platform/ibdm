apiVersion: jenkins.mia-platform.eu/v1
itemFamily: credentials
type: credential
syncable: true
mappings:
  identifier: |-
    {{ $folder := get "folder" .store (object "fullName" "") -}}
    {{- toJSON (list "jenkins-credential" .store.kind $folder.fullName .store.domain .credential.id) | sha256sum }}
  metadata:
    title: '{{ .credential.id | toJSON }}'
    description: '{{ .credential.description | toJSON }}'
  spec:
    id: '{{ .credential.id | toJSON }}'
    typeName: '{{ .credential.typeName | toJSON }}'
    store: '{{ .store | toJSON }}'
    usages: '{{ .usages | toJSON }}'
