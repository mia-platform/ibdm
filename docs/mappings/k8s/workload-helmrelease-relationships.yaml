apiVersion: mia-platform.eu/v1
itemFamily: relationships
type: workloadHelmReleaseRelationship
syncable: true
mappings:
  identifier: |-
    {{ $src := printf "urn:mia-platform-catalog:k8s.mia-platform-experimental.eu:v1:%s:%s" .kind (printf "k8s-%s-%s-%s-%s" (replace "https://" "" .apiServer) (lower .kind) .namespace .name | sha256sum) -}}
    {{- $type := "urn:mia-platform-catalog:mia-platform.eu:v1:RelationshipType:part-of.mia-platform.eu" -}}
    {{- $tgt := printf "urn:mia-platform-catalog:k8s.mia-platform-experimental.eu:v1:HelmRelease:%s" (printf "k8s-%s-helmrelease-%s-%s" (replace "https://" "" .apiServer) .releaseNamespace .releaseName | sha256sum) -}}
    {{- printf "%s-%s-%s" $src $type $tgt | sha256sum }}
  spec:
    sourceRef: |-
      urn:mia-platform-catalog:k8s.mia-platform-experimental.eu:v1:{{ .kind }}:{{ printf "k8s-%s-%s-%s-%s" (replace "https://" "" .apiServer) (lower .kind) .namespace .name | sha256sum }}
    targetRef: |-
      urn:mia-platform-catalog:k8s.mia-platform-experimental.eu:v1:HelmRelease:{{ printf "k8s-%s-helmrelease-%s-%s" (replace "https://" "" .apiServer) .releaseNamespace .releaseName | sha256sum }}
    typeRef: "urn:mia-platform-catalog:mia-platform.eu:v1:RelationshipType:part-of.mia-platform.eu"
