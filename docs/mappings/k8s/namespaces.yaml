apiVersion: k8s.mia-platform-experimental.eu/v1
itemFamily: namespaces
type: namespace
syncable: true
mappings:
  identifier: |-
    {{ printf "%s-%s" (replace "https://" "" .apiServer) .namespace.metadata.name | sha256sum }}
  metadata:
    title: "{{ .namespace.metadata.name }}"
  spec:
    name: "{{ .namespace.metadata.name }}"
    labels: |-
      {{ $labels := (get "labels" .namespace.metadata "") -}}
      {{- if $labels -}}
        {{- $labels | toJSON -}}
      {{- else -}}
        {{- object | toJSON -}}
      {{- end }}
  extra:
    - apiVersion: mia-platform.eu/v1
      itemFamily: relationships
      deletePolicy: "cascade"
      identifier: |-
        {{ $src := printf "urn:mia-platform-catalog:k8s.mia-platform-experimental.eu:v1:Namespace:%s" (printf "%s-%s" (replace "https://" "" .apiServer) .namespace.metadata.name | sha256sum) -}}
        {{- $type := "urn:mia-platform-catalog:mia-platform.eu:v1:RelationshipType:part-of.mia-platform.eu" -}}
        {{- $tgt := printf "urn:mia-platform-catalog:k8s.mia-platform-experimental.eu:v1:K8sCluster:%s" (printf "k8s-%s" (replace "https://" "" .apiServer) | sha256sum) -}}
        {{- printf "%s-%s-%s" $src $type $tgt | sha256sum }}
      sourceRef: |-
        urn:mia-platform-catalog:k8s.mia-platform-experimental.eu:v1:Namespace:{{ printf "%s-%s" (replace "https://" "" .apiServer) .namespace.metadata.name | sha256sum }}
      targetRef: |-
        urn:mia-platform-catalog:k8s.mia-platform-experimental.eu:v1:K8sCluster:{{ printf "k8s-%s" (replace "https://" "" .apiServer) | sha256sum }}
      typeRef: "urn:mia-platform-catalog:mia-platform.eu:v1:RelationshipType:part-of.mia-platform.eu"
