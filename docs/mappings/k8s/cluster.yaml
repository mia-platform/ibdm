apiVersion: k8s.mia-platform-experimental.eu/v1
itemFamily: k8sclusters
type: cluster
syncable: true
mappings:
  identifier: |-
    {{ printf "k8s-%s" (replace "https://" "" .apiServer) | sha256sum }}
  metadata:
    title: "{{ .clusterName }}"
  spec:
    name: "{{ .clusterName }}"
    nodeCount: "{{ .nodeCount }}"
    totalCPUCores: "{{ .totalCPUCores }}"
    nodes: "{{ .nodes | toJSON }}"
  extra:
    - apiVersion: mia-platform.eu/v1
      itemFamily: relationships
      deletePolicy: "none"
      identifier: |-
        {{ $src := printf "urn:mia-platform-catalog:console.mia-platform.eu:v1:Cluster:%s" (printf "%s" (replace "https://" "" .apiServer) | sha256sum) -}}
        {{- $type := "urn:mia-platform-catalog:mia-platform.eu:v1:RelationshipType:dependency.mia-platform.eu" -}}
        {{- $tgt := printf "urn:mia-platform-catalog:k8s.mia-platform-experimental.eu:v1:K8sCluster:%s" (printf "k8s-%s" (replace "https://" "" .apiServer) | sha256sum) -}}
        {{- printf "%s-%s-%s" $src $type $tgt | sha256sum }}
      sourceRef: |-
        urn:mia-platform-catalog:console.mia-platform.eu:v1:Cluster:{{ printf "%s" (replace "https://" "" .apiServer) | sha256sum }}
      targetRef: |-
        urn:mia-platform-catalog:k8s.mia-platform-experimental.eu:v1:K8sCluster:{{ printf "k8s-%s" (replace "https://" "" .apiServer) | sha256sum }}
      typeRef: "urn:mia-platform-catalog:mia-platform.eu:v1:RelationshipType:dependency.mia-platform.eu"
