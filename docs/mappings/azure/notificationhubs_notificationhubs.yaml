apiVersion: azure.mia-platform.eu/v1
itemFamily: notificationhubs
type: Microsoft.NotificationHubs/namespaces/notificationhubs
extra:
  apiVersion: "2026-01-01"
syncable: true
mappings:
  identifier: "{{ .id | sha256sum }}"
  metadata:
    title: "{{ .name }}"
  spec:
    name: "{{ .name }}"
    id: "{{ .id }}"
    kind: "{{ .kind }}"
    location: "{{ .location }}"
    managedBy: "{{ .managedBy }}"
    plan: |-
      {{ $plan := (get "plan" . "") -}}
      {{- if $plan -}}
        {{- .plan -}}
      {{- else -}}
        {{- "" | quote -}}
      {{- end }}
    dailyMaxActiveDevices: "{{ .properties.dailyMaxActiveDevices }}"
    hubName: "{{ .properties.name }}"
    registrationTtl: "{{ .properties.registrationTtl }}"
    tags: |-
      {{ $tags := (get "tags" . "") -}}
      {{- if $tags -}}
        {{- $tags | toJSON  -}}
      {{- else -}}
        {{- object | toJSON -}}
      {{- end }}
  extra:
    - apiVersion: mia-platform.eu/v1
      itemFamily: relationships
      deletePolicy: "cascade"
      identifier: |-
        {{ $namespaceId := printf "%s" (first (split "/notificationhubs/" .id)) -}}
        {{- $src := printf "urn:mia-platform-catalog:azure.mia-platform.eu:v1:NotificationHub:%s" (printf "%s" .id | sha256sum) -}}
        {{- $type := "urn:mia-platform-catalog:mia-platform.eu:v1:RelationshipType:part-of.mia-platform.eu" -}}
        {{- $tgt := printf "urn:mia-platform-catalog:azure.mia-platform.eu:v1:NotificationHubsNamespace:%s" ($namespaceId | sha256sum) -}}
        {{- printf "%s-%s-%s" $src $type $tgt | sha256sum }}
      sourceRef: |-
        urn:mia-platform-catalog:azure.mia-platform.eu:v1:NotificationHub:{{ printf "%s" .id | sha256sum }}
      targetRef: |-
        urn:mia-platform-catalog:azure.mia-platform.eu:v1:NotificationHubsNamespace:{{ printf "%s" (first (split "/notificationhubs/" .id)) | sha256sum }}
      typeRef: "urn:mia-platform-catalog:mia-platform.eu:v1:RelationshipType:part-of.mia-platform.eu"
