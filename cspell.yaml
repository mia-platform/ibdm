version: "0.2"
language: en,en-GB,en-US
useGitignore: true
allowCompoundWords: true
ignoreRegExpList:
  - "import\\s*\\((.|[\r\n])*?\\)"
  - "import\\s*.*\".*?\""
  - "//\\s*go:generate.*"
  - "//\\s*nolint:.*"
words:
  - anchore
  - apim
  - apimservices
  - buildx
  - contoso
  - createif
  - diber
  - epss
  - fabrikam
  - fsys
  - golangci
  - healthz
  - HMAC
  - ibdm
  - itds
  - kubeconfig
  - kubelet
  - milli
  - mylib
  - mytoken
  - postgresqldb
  - postgresqldbs
  - SCTP
  - sonarqube
  - Sonatype
  - syft
  - sysdig
  - tmpl
  - upserted
  - upserts
  - uuidv
  - xmia
ignoreWords:
  - Dsonar
  - acks
  - apiv
  - appsv
  - assetpb
  - azblob
  - azcore
  - azeventhubs
  - azidentity
  - azsystemevents
  - bbtoken
  - clusterip
  - corev
  - errln
  - errorresultid
  - fakeazcore
  - Fslash
  - goarch
  - goarm
  - gobin
  - gomod
  - gopath
  - hclog
  - metav
  - mygroup
  - myresult
  - mysecret
  - myuser
  - networkingv
  - nomatch
  - nophase
  - noprefixhex
  - octocat
  - pubsubpb
  - sclusters
  - structpb
  - sysdiglabs
  - sysql
  - Vjcm
  - vtpm
  - vulndb
  - vulns
  - Vulns
files:
  - "**/*.go"
  - "**/*.md"
  - "**/*.mk"
  - ".devcontainer/devcontainer.json"
  - ".github/*.yml"
  - ".github/**/*.yaml"
  - "internal/mappings/data/**/*.yaml"
  - Makefile
